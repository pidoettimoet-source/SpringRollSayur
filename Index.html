<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spring Roll Sayur</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            color: #2c7a7b;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(44, 122, 123, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: #4a5568;
            text-align: center;
            margin-bottom: 40px;
            font-style: italic;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(44, 122, 123, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 25px;
            text-align: center;
        }

        .container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(44, 122, 123, 0.3);
            transition: transform 0.3s ease;
        }

        .container img:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        .caption {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c7a7b;
        }
    </style>
</head>
<body>
    <h1>Spring Roll Sayur</h1>
    <div class="subtitle">Spring Roll Sayur Rasa yang Pernah ada, Segar, Sehat, & Penuh Cita Rasa</div>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=600&q=80" alt="Spring Roll Sayur Variasi" />
        <div class="caption">Variasi Spring Roll Sayur Segar & Lezat</div>
    </div>
</body>
</html>
